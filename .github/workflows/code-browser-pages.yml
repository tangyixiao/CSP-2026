name: Code browser and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete archive for same-origin source snapshots
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Run website checks
        run: npm test
        working-directory: website
      - name: Verify archive packaging preserves original files
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build code browser and pinned catalog
        run: npm run build
        working-directory: website
      - name: Publish read-only discussion metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/sync-discussion-metadata.mjs
      - name: Include discussion metadata in the built browser
        run: cp website/public/discussion-metadata.json website/dist/discussion-metadata.json
      - name: Assemble landing page, documentation, and code browser
        run: node website/scripts/package-site.mjs
      - name: Retain bounded metadata for pull-request review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review
          path: |
            website/dist/catalog/
            website/dist/discussion-metadata.json
          retention-days: 3
          compression-level: 9
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/site-dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
