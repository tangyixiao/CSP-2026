name: Package province archive release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full source commit SHA matching the draft release target
        required: true
      tag:
        description: Existing draft release tag
        required: true
        default: archive-2026-11-08
      release_id:
        description: Existing draft release numeric ID
        required: true
        default: '438271996'

permissions:
  contents: read

concurrency:
  group: archive-release
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the pinned archive
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and upload one region at a time
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.revision }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python scripts/package_provinces.py --revision "$SOURCE_REVISION" --tag "$RELEASE_TAG" --release-id "$RELEASE_ID" --upload
